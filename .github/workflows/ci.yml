name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Runners pinned to one Ubuntu release: ubuntu-latest moves on to the next one on GitHub's schedule, not ours
jobs:
  backend:
    name: Lint & Test (Python)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        # v5.1.0 (Node 24)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python 3.12
        # v6.3.0 (Node 24). The oldest Python the package supports
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Set up uv
        # v10.2.0 (Node 24)
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.13.6"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Ruff linter
        run: uv run ruff check .

      - name: Run Ruff formatter check
        run: uv run ruff format --check .

      - name: Run Pyright
        # The version pinned in the dev group; uv run points it at the synced .venv
        run: uv run pyright
        env:
          # Pinned on purpose: no "new pyright version available" notice in the log
          PYRIGHT_PYTHON_IGNORE_WARNINGS: "1"

      - name: Run pytest
        run: uv run pytest

  frontend:
    name: Lint, Test & Build (UI)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        # v5.1.0 (Node 24)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Node 22
        # v7.1.0 (Node 24)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Prettier check
        run: npm run format:check

      - name: Check the API types match the schema
        # schema.d.ts is generated from openapi.json; the backend's tests check that one against the API
        run: npm run api:check

      - name: Run Vitest
        run: npm run test

      - name: Build
        run: npm run build

  package:
    name: Build package
    needs: [backend, frontend]
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        # v5.1.0 (Node 24)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Node 22
        # v7.1.0 (Node 24)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up uv
        # v10.2.0 (Node 24)
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.13.6"

      - name: Build the UI
        run: npm --prefix frontend ci && npm --prefix frontend run build

      - name: Build wheel and sdist
        run: uv build

      - name: Check the wheel carries the UI
        run: unzip -l dist/*.whl | grep -q 'channels_cleaner/static/index.html'

      - name: Upload the package
        # v7.0.2 (Node 24)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dist
          path: dist/

  docker:
    name: Build image
    needs: [backend, frontend]
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        # v5.1.0 (Node 24)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Buildx
        # v4.4.1
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Build
        # v7.4.0. Pushed only by the release workflow
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

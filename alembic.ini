# For the alembic CLI in a checkout (`uv run alembic …`). The app runs the same migrations itself on start, from the
# package. Without sqlalchemy.url the database is the one the app's settings point to (./data/cleaner.sqlite3, or
# mock.sqlite3 with CC_MOCK=1).
[alembic]
script_location = channels_cleaner:migrations
prepend_sys_path = .
path_separator = os
# Files sort by date: 20261120_<revision>_<slug>.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
